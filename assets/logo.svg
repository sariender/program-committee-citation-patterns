<svg xmlns="http://www.w3.org/2000/svg" width="420" height="180" viewBox="0 0 420 180">
  <style>
    .node { fill:#222; }
    .edge { stroke:#222; stroke-width:1.5; marker-end:url(#arrow); }
    .label { font-family: serif; font-size:16px; fill:#222; text-anchor:middle; }
    .conf { fill:#666; }
    .conf-edge { stroke:#666; stroke-width:1.2; stroke-dasharray:4,4; marker-end:url(#arrow-conf); fill:none; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#222"/>
    </marker>
    <marker id="arrow-conf" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#666"/>
    </marker>
  </defs>

  <circle class="node" cx="100" cy="100" r="6"/>
  <circle class="node" cx="320" cy="100" r="6"/>

  <line class="edge" x1="106" y1="100" x2="314" y2="100"/>

  <text class="label" x="100" y="125">PC membership</text>
  <text class="label" x="320" y="125">Citations</text>

  <circle class="conf" cx="210" cy="40" r="6"/>
  <text class="label" x="210" y="25">Confounders ☠</text>

  <path class="conf-edge" d="M210 46 C170 70,140 80,106 94"/>
  <path class="conf-edge" d="M210 46 C250 70,280 80,314 94"/>

</svg>
